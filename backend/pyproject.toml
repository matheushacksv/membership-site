[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.14",
    "django>=6.0.5",
    "django-cors-headers>=4.9.0",
    "django-ninja>=1.6.2",
    "django-ninja-jwt>=5.4.4",
    "django-q2>=1.10.0",
    "django-storages>=1.14.6",
    "django-stubs>=6.0.5",
    "gunicorn>=26.0.0",
    "pillow>=12.2.0",
    "psycopg>=3.3.4",
    "psycopg2-binary>=2.9.12",
    "pydantic[email]>=2.13.4",
    "pypdf>=6.14.2",
    "python-decouple>=3.8",
    "redis>=7.4.0",
    "reportlab>=5.0.0",
]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
# RUF012 "mutable default" é falso-positivo neste projeto: os alvos são idioms seguros —
# ninja Schema (pydantic copia o default por instância) e Django (Meta.indexes/constraints,
# dependencies/operations de migration, admin.inlines). Reescrever com default_factory seria
# churn sem mudança de comportamento.
ignore = ["RUF012"]

[tool.ruff.format]
quote-style = "single"
