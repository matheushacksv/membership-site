name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /app/membership
            git pull --ff-only origin main
            docker compose up -d --build
            docker compose exec -T backend python manage.py migrate --noinput
            docker compose exec -T backend python manage.py collectstatic --noinput || true
            # Caddyfile e bind-mount de arquivo unico: o mount prende o inode, e
            # 'git pull' reescreve o arquivo via rename atomico (inode novo). O
            # container caddy continua vendo o inode antigo, entao 'reload' e
            # 'restart' leem a config velha. So recriar o container re-resolve o
            # bind para o inode atual. --no-deps evita recriar backend/frontend.
            docker compose up -d --no-deps --force-recreate caddy
